<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кофейня Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }
        button.circle-btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        span#count {
            font-size: 20px;
            font-weight: bold;
            margin: 0 15px;
        }
        button.submit-btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>☕ Кофе навынос</h2>
        <div>25 000 сум / шт.</div>
        <br>
        <div>
            <button class="circle-btn" onclick="changeCount(-1)">-</button>
            <span id="count">1</span>
            <button class="circle-btn" onclick="changeCount(1)">+</button>
        </div>
        <br>
        <div id="total" style="font-weight: bold;">Итого: 25 000 сум</div>

        <button class="submit-btn" onclick="checkout()">Оформить заказ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let count = 1;
        const pricePerItem = 25000;

        function changeCount(delta) {
            count += delta;
            if (count < 1) count = 1;
            document.getElementById('count').innerText = count;
            document.getElementById('total').innerText = 'Итого: ' + (count * pricePerItem).toLocaleString() + ' сум';
        }

        function checkout() {
            const orderData = JSON.stringify({
                product: "Кофе навынос",
                quantity: count,
                total_price: (count * pricePerItem) + " сум"
            });

            // Отправка данных боту и закрытие приложения
            tg.sendData(orderData);
            tg.close();
        }
    </script>
</body>
</html>
